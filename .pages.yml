media:
  input: public/images
  output: /images

content:
  - name: pages
    label: "Pages"
    type: collection
    path: src/content/pages
    fields:
      - name: title
        label: "Page Title"
        type: string
        required: true

      - name: description
        label: "Meta Description"
        type: string

      - name: body
        label: "Content"
        type: rich-text

  - name: blog
    label: "Blog Posts"
    type: collection
    path: src/content/blog
    fields:
      - name: title
        label: "Post Title"
        type: string
        required: true

      - name: description
        label: "Short Excerpt"
        type: string

      - name: pubDate
        label: "Publish Date"
        type: date

      - name: heroImage
        label: "Cover Image"
        type: image

      - name: body
        label: "Content"
        type: rich-text